# Render Blueprint — deploys the API (spec 2.4).
# In Render: New → Blueprint → connect your repo. Free tier spins down after
# ~15 min idle and cold-starts in ~30s — accepted for V1 per spec.
services:
  - type: web
    name: hr-saas-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false # paste your Neon connection string
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: SUPER_ADMIN_USERNAME
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false # https://<customer>.vercel.app,https://<admin>.vercel.app
      - key: CUSTOMER_PORTAL_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
